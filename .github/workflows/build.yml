name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach the installer to a GitHub Release

jobs:
  windows:
    runs-on: windows-latest   # ships with Python and Inno Setup 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sticks.py --selftest
      - run: build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: StickFigures
          path: |
            dist/sticks.exe
            dist/StickFiguresSetup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/sticks.exe
            dist/StickFiguresSetup.exe
